{% load dashboard_format %}<li><button type="button" class="reco-chip" data-academy="{{ a.id }}"><span class="reco-chip-name">{{ a.name }}</span> <span class="reco-chip-val">{% if a.kind == "activation" %}comptes <span class="{{ a.shown.users|trend }}">{{ a.shown.users|fr_pct0 }}</span> · intensité <span class="{{ a.shown.intensity|trend }}">{{ a.shown.intensity|fr_pct0 }}</span>{% else %}<span class="{{ a.shown.rel7|trend }}">{{ a.shown.rel7|fr_pct0 }}</span> sur 7 jours · <span class="{{ a.shown.rel14|trend }}">{{ a.shown.rel14|trend_arrow }} {{ a.shown.rel14|fr_pct0 }}</span> sur 14 jours{% endif %}</span><span class="chev" aria-hidden="true">›</span><span class="reco-chip-vol">{{ a.current|fr_int }} nouveaux comptes contre {{ a.previous|fr_int }}</span></button></li>
