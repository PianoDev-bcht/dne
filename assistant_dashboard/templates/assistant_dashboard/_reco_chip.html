{% load dashboard_format %}<li><button type="button" class="reco-chip" data-academy="{{ a.id }}"{% if a.kind != "activation" %} title="vs France {{ a.national|fr_pct0 }}"{% endif %}>{{ a.name }} <span class="reco-chip-val">{% if a.kind == "activation" %}comptes <span class="{{ a.evolution_users|trend }}">{{ a.evolution_users|fr_pct0 }}</span> · intensité <span class="{{ a.evolution_intensity|trend }}">{{ a.evolution_intensity|fr_pct0 }}</span>{% else %}<span class="{{ a.evolution|trend }}">{{ a.evolution|trend_arrow }} {{ a.evolution|fr_pct0 }}</span>{% endif %}</span><span class="chev" aria-hidden="true">›</span></button></li>
